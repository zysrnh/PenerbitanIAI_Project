<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820">
        <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#032c21" />
                <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>
            <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
                <stop offset="30%" stop-color="rgba(0,0,0,0.05)" />
                <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
            </linearGradient>
            <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            </pattern>
        </defs>
        
        <!-- Background -->
        <rect width="600" height="820" fill="url(#bgGrad)" />
        <rect width="600" height="820" fill="url(#pattern)" />
        
        <!-- Spine crease line -->
        <rect x="0" y="0" width="24" height="820" fill="url(#spine)" />
        <line x1="24" y1="0" x2="24" y2="820" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
        
        <!-- Border Frame -->
        <rect x="45" y="45" width="510" height="730" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
        <rect x="52" y="52" width="496" height="716" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        
        <!-- Publisher Badge -->
        <rect x="80" y="80" width="160" height="32" rx="4" fill="rgba(0,0,0,0.3)" />
        <text x="160" y="101" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2">PERSIS PERS</text>
        
        <!-- Category Tag -->
        <rect x="420" y="80" width="100" height="32" rx="4" fill="rgba(255,255,255,0.15)" />
        <text x="470" y="101" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sinopsis Belakang</text>
        
        <!-- Gold Accent Line -->
        <line x1="80" y1="240" x2="160" y2="240" stroke="#f59e0b" stroke-width="4" />
        
        <!-- Book Title (Wrapped simulation) -->
        <text x="80" y="300" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900" line-height="1.2">
            Sinopsis &amp; Tinjauan Pustaka:
        </text>
        <text x="80" y="345" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">
             Metodologi Penelitian Studi
        </text>
        <text x="80" y="390" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="900">
             Islam &amp; Integrasi Sains
        </text>
        
        <!-- Divider -->
        <line x1="80" y1="440" x2="520" y2="440" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
        
        <!-- Author -->
        <text x="80" y="500" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">PENULIS / DOSEN PENGAMPU:</text>
        <text x="80" y="535" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Dr. H. Ahmad Fauzi, M.Ag.</text>
        
        <!-- University Monogram -->
        <circle cx="300" cy="650" r="45" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        <text x="300" y="658" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">IAI</text>
        
        <!-- Footer -->
        <text x="300" y="740" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">EDISI LENGKAP STANDAR UNESCO B5</text>
    </svg>