<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820">
        <rect width="600" height="820" fill="#fdfbf7" />
        
        <!-- Spine edge -->
        <rect x="0" y="0" width="20" height="820" fill="rgba(0,0,0,0.04)" />
        <line x1="20" y1="0" x2="20" y2="820" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
        
        <!-- Header -->
        <text x="50" y="60" fill="#64748b" font-family="serif" font-size="12" font-style="italic">PERSIS PERS • Publikasi Ilmiah Kampus</text>
        <text x="550" y="60" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Halaman 1</text>
        <line x1="50" y1="75" x2="550" y2="75" stroke="#cbd5e1" stroke-width="1"/>
        
        <!-- Chapter Title -->
        <text x="300" y="140" fill="#0f172a" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle">BAB I: PENDAHULUAN &amp; LANDASAN</text>
        <line x1="260" y1="160" x2="340" y2="160" stroke="#047857" stroke-width="3" />
        
        <!-- Paragraph text simulation -->
        <g fill="#334155" font-family="serif" font-size="14" font-weight="normal" letter-spacing="0.5">
            <text x="70" y="210">Kajian literatur dan telaah akademis mengenai tema riset ini disusun untuk</text>
            <text x="50" y="235">memberikan kerangka komprehensif bagi pembaca, akademisi, dan mahasiswa</text>
            <text x="50" y="260">tingkat sarjana maupun pascasarjana dalam memahami metodologi kajian ilmiah.</text>
            
            <text x="70" y="310">Buku ini menyajikan integrasi kurikulum terpadu dengan standar keilmuan</text>
            <text x="50" y="335">yang mengedepankan otentisitas sumber, kedalaman analisis, serta penerapan</text>
            <text x="50" y="360">praktis dalam menjawab tantangan problematika masyarakat kontemporer.</text>
            
            <!-- Quote Box -->
            <rect x="50" y="410" width="500" height="90" fill="#f1f5f9" rx="4" stroke="#94a3b8" stroke-dasharray="4"/>
            <text x="80" y="445" font-style="italic" fill="#047857" font-weight="bold">"Ilmu pengetahuan dan riset yang berakar pada nilai-nilai integritas</text>
            <text x="80" y="475" font-style="italic" fill="#047857" font-weight="bold">merupakan pilar utama kemajuan peradaban dan pendidikan."</text>
            
            <text x="70" y="550">Melalui penerbitan buku standar UNESCO B5 Bookpaper ini, PERSIS PERS</text>
            <text x="50" y="575">berkomitmen memfasilitasi hilirisasi karya ilmiah dosen dan peneliti menuju</text>
            <text x="50" y="600">taraf publikasi bereputasi nasional dan terdaftar ISBN resmi Perpusnas RI.</text>
        </g>
        
        <!-- Footer -->
        <line x1="50" y1="740" x2="550" y2="740" stroke="#cbd5e1" stroke-width="1"/>
        <text x="300" y="770" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Hak Cipta Dilindungi Undang-Undang • Terbitan Resmi PERSIS PERS</text>
    </svg>